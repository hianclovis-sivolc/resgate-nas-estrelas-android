name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Baixar Gradle 8.11.1 oficial
        run: |
          curl -L --fail --retry 3             -o /tmp/gradle-8.11.1-bin.zip             https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle-8.11.1-bin.zip"             | sha256sum -c -

          sudo unzip -q /tmp/gradle-8.11.1-bin.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Conferir Gradle
        run: gradle --version

      - name: Compilar APK de teste
        run: gradle assembleDebug --no-daemon

      - name: Enviar APK para download
        uses: actions/upload-artifact@v7
        with:
          name: Resgate-nas-Estrelas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
